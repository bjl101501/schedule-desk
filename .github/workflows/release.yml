name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build front end
        run: python build/inject.py

      - name: Build app
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/schedule-desk.exe dist/ScheduleDesk.exe
          # 无论 MSVC 还是 GNU 构建，运行时都需要 WebView2Loader.dll；
          # 它由 webview2-com-sys 在构建目录里产出，不在 target/release 根下。
          $dll = Get-ChildItem "src-tauri/target/release/build/webview2-com-sys-*/out/x64/WebView2Loader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw "WebView2Loader.dll not found in build output" }
          Copy-Item $dll.FullName dist/WebView2Loader.dll
          Copy-Item docs/使用说明.txt dist/使用说明.txt
          Compress-Archive -Path dist/* -DestinationPath ScheduleDesk.zip -Force
          Get-ChildItem dist | Select-Object Name, Length

      - uses: softprops/action-gh-release@v2
        with:
          files: ScheduleDesk.zip
          generate_release_notes: true
