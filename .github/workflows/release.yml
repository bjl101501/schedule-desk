name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build front end
        run: python build/inject.py

      - name: Build app
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/schedule-desk.exe dist/ScheduleDesk.exe
          # MSVC 目标把 WebView2 加载器静态链接进 exe；GNU 目标才需要旁边放 DLL
          $dll = "src-tauri/target/release/WebView2Loader.dll"
          if (Test-Path $dll) { Copy-Item $dll dist/WebView2Loader.dll }
          Copy-Item docs/使用说明.txt dist/使用说明.txt
          Compress-Archive -Path dist/* -DestinationPath ScheduleDesk.zip -Force
          Get-ChildItem dist | Select-Object Name, Length

      - uses: softprops/action-gh-release@v2
        with:
          files: ScheduleDesk.zip
          generate_release_notes: true
