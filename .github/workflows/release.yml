name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build front end
        run: python build/inject.py

      - name: Build app
        working-directory: src-tauri
        run: cargo build --release

      - name: Package
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = "src-tauri/target/release/schedule-desk.exe"
          Copy-Item $exe dist/ScheduleDesk.exe
          # MSVC 目标静态链接 WebView2 加载器，只有动态依赖时才需要随包附带 DLL。
          $needsDll = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($exe)).Contains('WebView2Loader.dll')
          if ($needsDll) {
            $dll = Get-ChildItem "src-tauri/target/release/build/webview2-com-sys-*/out/x64/WebView2Loader.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dll) { throw "exe depends on WebView2Loader.dll but it was not produced by the build" }
            Copy-Item $dll.FullName dist/WebView2Loader.dll
            Write-Output "dynamic link: bundling WebView2Loader.dll"
          } else {
            Write-Output "static link: single file, no dll"
          }
          Copy-Item docs/使用说明.txt dist/使用说明.txt
          Compress-Archive -Path dist/* -DestinationPath ScheduleDesk.zip -Force
          Get-ChildItem dist | Select-Object Name, Length

      - uses: softprops/action-gh-release@v2
        with:
          files: ScheduleDesk.zip
          generate_release_notes: true
