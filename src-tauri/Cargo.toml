[package]
name = "schedule-desk"
version = "2.1.0"
description = "Schedule Desk - personal schedule workbench"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls 只是把模块暴露出来，真正生效要由 net.rs 显式注入连接器
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
# 只为拿到 Urgency::Critical → Windows toast 的 reminder 场景（常驻到用户关闭）
notify-rust = { version = "4", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
